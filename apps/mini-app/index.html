<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050706" />
    <title>Adnet</title>
    <link rel="stylesheet" href="styles/tokens.css?v=campaigns-label" />
    <link rel="stylesheet" href="styles/app.css?v=campaigns-label" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="app-shell" data-app-shell>
      <header class="app-header" aria-label="Adnet">
        <a class="brand-lockup" href="#/" aria-label="Adnet">
          <span class="brand-mark">
            <img src="assets/adnet-mark.png" alt="" />
          </span>
          <strong>Adnet</strong>
        </a>
        <div class="header-actions" aria-label="Быстрые действия">
          <button class="header-icon-button" type="button" aria-label="Сообщения">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 7.8C5 6.25 6.25 5 7.8 5h8.4C17.75 5 19 6.25 19 7.8v5.4c0 1.55-1.25 2.8-2.8 2.8H11l-4.2 3v-3H7.8C6.25 16 5 14.75 5 13.2V7.8Z" />
            </svg>
          </button>
          <button class="wallet-control" type="button" aria-label="Баланс 0 рублей">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5.5 7.5h12A2.5 2.5 0 0 1 20 10v6.5a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-10A1.5 1.5 0 0 1 5.5 5h10.75" />
              <path d="M16 13h4" />
            </svg>
            <span>0 ₽</span>
          </button>
        </div>
      </header>

      <main class="app-main" id="app-root" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="Основная навигация" data-bottom-nav></nav>
    </div>

    <noscript>
      <section class="noscript-state">
        <h1>Нужен JavaScript</h1>
        <p>Adnet нужен JavaScript для работы интерфейса.</p>
      </section>
    </noscript>

    <script type="module" src="src/app-shell.js?v=campaigns-label"></script>
  </body>
</html>
