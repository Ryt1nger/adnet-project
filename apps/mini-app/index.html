<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050706" />
    <title>Adnet Mini App Shell</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/app.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="app-shell" data-app-shell>
      <header class="app-header" aria-label="Adnet app header">
        <a class="brand-mark" href="#/" aria-label="Adnet shell home">
          <img src="assets/adnet-mark.png" alt="Adnet" />
        </a>
        <div class="header-copy">
          <span>Adnet</span>
          <strong>Mini App foundation</strong>
        </div>
        <span class="runtime-pill" data-runtime-pill>Web preview</span>
      </header>

      <main class="app-main" id="app-root" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="Основная навигация Mini App" data-bottom-nav></nav>
    </div>

    <noscript>
      <section class="noscript-state">
        <h1>Нужен JavaScript</h1>
        <p>Adnet Mini App работает как визуальное web-приложение внутри Telegram.</p>
      </section>
    </noscript>

    <script type="module" src="src/app-shell.js"></script>
  </body>
</html>
