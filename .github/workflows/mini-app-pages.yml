name: Deploy Mini App Preview

on:
  push:
    branches:
      - module/auth-session-roles
    paths:
      - apps/mini-app/**
      - .github/workflows/mini-app-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: adnet-mini-app-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Mini App artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mini-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
